name: CellFlow CI + Real CKB Testnet

# One workflow, four isolated safety domains:
# - All pushes and PRs run offline checks AND ephemeral PostgreSQL integration tests.
# - The PostgreSQL service exists only inside its GitHub-hosted CI job.
# - Manual PostgreSQL tests use ONLY a separately protected Neon test branch.
# - The Vercel backend owns its own Production DATABASE_URL; never migrate it from CI.
# - Live spending uses the hosted API only after manual dispatch on main with the protected
#   ckb-testnet environment and a successfully completed CI job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_db_integration:
        description: 'Run PostgreSQL migration, settlement, concurrency and webhook tests against isolated Neon branch'
        type: boolean
        required: true
        default: false
      run_live_testnet:
        description: 'Broadcast and verify real CKB Pudge testnet transactions (requires funded wallets)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  ci:
    name: Offline release checks, typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (offline tests; no database or .env file)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            # Preserve a genuine checked-in lockfile if the repository has one.
            # A stale committed lock should fail rather than silently change versions.
            npm ci --no-audit --no-fund
          else
            # Do not generate a temporary lock then run npm ci: npm's workspace
            # lock-only resolver can create inconsistent nested Zod 3/4 entries.
            # A single unlocked installation is supported while no lock is committed.
            echo '::warning::No package-lock.json. Installing dependencies directly without writing a lockfile; this is not a reproducible install.'
            npm install --package-lock=false --no-audit --no-fund
          fi
      - name: Verify strict release preflight
        run: npm run release:check
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Deterministic and security regressions (no database)
        run: npm run test:github-offline
      - name: Deployment contract regression tests
        run: npm run test:vercel-deployment
      - name: Build production app
        run: npm run build

  db_postgres:
    name: PostgreSQL 16 integration (automatic, ephemeral)
    # An isolated, brand-new database on the GitHub-hosted runner for every
    # push, PR and manual dispatch. This job receives NO production/Neon secrets.
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cellflow_ci
          POSTGRES_PASSWORD: cellflow_ci_disposable
          POSTGRES_DB: cellflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cellflow_ci -d cellflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # Disposable CI-only credentials; these are NOT Neon or Vercel secrets.
      # Both URLs point to the same throwaway GitHub Postgres instance.
      DATABASE_URL: postgresql://cellflow_ci:cellflow_ci_disposable@127.0.0.1:5432/cellflow_ci?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://cellflow_ci:cellflow_ci_disposable@127.0.0.1:5432/cellflow_ci?sslmode=disable
      CELLFLOW_DB_TEST_ALLOW: 'true'
      CELLFLOW_DB_TEST_CONFIRM_ISOLATED: github-actions-postgres-service
      CELLFLOW_REQUIRE_DB_TESTS: 'true'
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --package-lock=false --no-audit --no-fund
          fi
      - name: Apply migrations and run ALL PostgreSQL integration tests
        # This command fails if the database is inaccessible or a test fails.
        run: npm run test:db-integration
      - name: Publish safe PostgreSQL test result
        if: success()
        shell: bash
        run: |
          echo '### CellFlow PostgreSQL 16 integration' >> "$GITHUB_STEP_SUMMARY"
          echo '- Backend: disposable GitHub Actions PostgreSQL service (NOT Neon/Vercel production)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Migration + concurrency + settlement + webhook integration: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  db_integration:
    name: Isolated Neon PostgreSQL integration proof
    needs: ci
    # Extra optional Neon test-branch verification; NOT production.
    # The automatic db_postgres job does not require Neon credentials.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_db_integration == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cellflow-db-integration
    concurrency:
      group: cellflow-isolated-db-integration
      cancel-in-progress: false
    env:
      # Secrets belong ONLY to the protected DB-test environment.
      DATABASE_URL: ${{ secrets.CELLFLOW_TEST_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.CELLFLOW_TEST_DATABASE_URL_UNPOOLED }}
      CELLFLOW_DB_TEST_EXPECTED_HOST: ${{ vars.CELLFLOW_TEST_DB_EXPECTED_HOST }}
      CELLFLOW_PRODUCTION_DB_HOST: ${{ vars.CELLFLOW_PRODUCTION_DB_HOST }}
      CELLFLOW_DB_TEST_ALLOW: 'true'
      CELLFLOW_DB_TEST_CONFIRM_ISOLATED: 'isolated-neon-branch'
      CELLFLOW_REQUIRE_DB_TESTS: 'true'
      NODE_ENV: 'test'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies with existing lockfile when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --package-lock=false --no-audit --no-fund
          fi
      - name: Fail-closed migration and nine real-DB integration tests
        run: npm run test:db-integration
      - name: Publish summary without exposing database credentials
        if: success()
        shell: bash
        run: |
          echo '### CellFlow isolated Neon integration proof' >> "$GITHUB_STEP_SUMMARY"
          echo '- Database: protected, independently configured Neon test branch' >> "$GITHUB_STEP_SUMMARY"
          echo '- Schema migrations, concurrency, settlement, reorg and signed webhook tests: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  testnet:
    name: Funded wallets / real transaction evidence
    needs: ci
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_live_testnet == true }}
    runs-on: ubuntu-24.04
    environment: ckb-testnet
    timeout-minutes: 90
    concurrency:
      group: cellflow-real-testnet
      cancel-in-progress: false
    env:
      CELLFLOW_TESTNET_CI: 'true'
      CELLFLOW_TESTNET_STRICT_WALLET_ISOLATION: 'true'
      CELLFLOW_TESTNET_REQUIRE_RBF: 'true'
      CELLFLOW_TESTNET_RESUME_SCENARIOS: 'false'
      CELLFLOW_LOCAL_RESUME: 'false'
      CELLFLOW_EVIDENCE_DIR: ${{ github.workspace }}/.testnet-ci-evidence
      CKB_NETWORK: testnet
      CELLFLOW_URL: ${{ vars.CELLFLOW_URL || 'https://cellflow-brown.vercel.app' }}
      CKB_RPC_URL: ${{ vars.CKB_RPC_URL || 'https://testnet.ckbapp.dev/rpc' }}
      CKB_RPC_FALLBACK_URLS: ${{ vars.CKB_RPC_FALLBACK_URLS || 'https://testnet.ckb.dev/' }}
      # PUBLIC Testnet addresses. Configure Environment vars to override the
      # defaults when rotating isolated wallet secrets. Never commit keys.
      CELLFLOW_TESTNET_ADDRESS_A: ${{ vars.CELLFLOW_TESTNET_ADDRESS_A || 'ckt1qzda0cr08m85hc8jlnfp3zer7xulejywt49kt2rr0vthywaa50xwsqf5wntu74dvvhydys0ekc5nmta27q7ed7g03qw8c' }}
      CELLFLOW_TESTNET_ADDRESS_B: ${{ vars.CELLFLOW_TESTNET_ADDRESS_B || 'ckt1qzda0cr08m85hc8jlnfp3zer7xulejywt49kt2rr0vthywaa50xwsqdf72483m8lkuvgn50752jw69ny6ywagwgnzqtwj' }}
      # These must identify the *actually deployed* backend and public testnet.
      CELLFLOW_EXPECTED_RELEASE_SHA: ${{ vars.CELLFLOW_DEPLOYED_SHA }}
      CKB_EXPECTED_GENESIS_HASH: ${{ vars.CKB_TESTNET_GENESIS_HASH }}
      # Only the protected environment provides these secret values.
      CKB_TESTNET_PRIVATE_KEY_A: ${{ secrets.CKB_TESTNET_PRIVATE_KEY_A }}
      CKB_TESTNET_PRIVATE_KEY_B: ${{ secrets.CKB_TESTNET_PRIVATE_KEY_B }}
      CELLFLOW_API_KEY: ${{ secrets.CELLFLOW_TESTNET_API_KEY }}
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no local database or .env file)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            echo '::warning::No package-lock.json. Installing without generating a temporary workspace lockfile.'
            npm install --package-lock=false --no-audit --no-fund
          fi
      - name: Initialize safe status directories
        shell: bash
        run: mkdir -p .testnet-ci-evidence .testnet-ci-report
      - name: Display public deposit addresses (never private keys)
        shell: bash
        run: |
          printf 'Fund Wallet A: %s\n' "$CELLFLOW_TESTNET_ADDRESS_A"
          printf 'Fund Wallet B: %s\n' "$CELLFLOW_TESTNET_ADDRESS_B"
          printf 'Faucet: https://faucet.nervos.org/\n'
      - name: Validate secret formats and strict network configuration
        run: node scripts/evidence/ci-testnet-config.mjs
      - name: Broadcast and confirm real CKB testnet scenarios
        run: npm run validate:testnet-live
      - name: Redact, checksum and verify real evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node scripts/evidence/package-review-bundle.mjs \
            --source "$CELLFLOW_EVIDENCE_DIR" \
            --out .testnet-ci-review \
            --sha "$CELLFLOW_EXPECTED_RELEASE_SHA"
          node scripts/evidence/package-review-bundle.mjs --verify .testnet-ci-review
          mkdir -p "$CELLFLOW_EVIDENCE_DIR/.state"
          printf 'verified\n' > "$CELLFLOW_EVIDENCE_DIR/.state/github-bundle-verified.ok"
      - name: Publish safe status summary even when failing
        if: always()
        shell: bash
        run: |
          mkdir -p .testnet-ci-report
          if [[ -f scripts/evidence/github-testnet-summary.mjs ]]; then
            node scripts/evidence/github-testnet-summary.mjs --source .testnet-ci-evidence --out .testnet-ci-report
          else
            # Checkout/bootstrap failure must not suppress a safe diagnostic artifact.
            printf '{"status":"NOT_STARTED","reason":"Checkout or runtime files unavailable"}\n' > .testnet-ci-report/status.json
          fi
      - name: Upload public status / faucet addresses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellflow-testnet-status-${{ github.run_id }}
          path: .testnet-ci-report/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload strictly verified redacted chain evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cellflow-testnet-verified-${{ github.run_id }}
          path: .testnet-ci-review/
          retention-days: 30
          if-no-files-found: error
